[build]
builder = "NIXPACKS"
#buildCommand = "npm ci && npm run build"
buildCommand = "npm run build"

[deploy]
# 'serve' statically serves the Vite build output on the PORT Railway assigns.
#
# --config points at serve.json, which stops browsers caching index.html. Without it the
# entry document ships no Cache-Control at all, so a browser holds on to it heuristically
# and keeps requesting the hashed chunks that old copy names -- which are still on disk
# from the previous deploy. Everything loads, a build behind, and redeploying does not
# help. The path is resolved relative to the SERVED directory, not the working directory,
# hence the '../'.
startCommand = "npx serve -s dist -l $PORT --config ../serve.json"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables
# Set VITE_API_BASE_URL in the Railway dashboard (or via the Railway CLI):
#   railway variables set VITE_API_BASE_URL=https://<your-backend>.up.railway.app
#
# Note: VITE_ prefixed variables must be available at BUILD TIME.
# Add them in: Railway Dashboard → your service → Variables, before deploying.
